  <style>
    :root {
      --primary: #2563eb;
      --secondary: #0ea5e9;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --font-family: 'Inter', sans-serif;
      --card-radius: 1.25rem;
      --btn-radius: 0.85rem;
      --bg-image: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    .public-bg-layer {
      background-color: var(--bg-page);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Динамические стили карточек и кнопок, управляемые из Конструктора дизайна */
    .themed-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background-color 0.3s ease, border-color 0.3s ease;
    }

    .themed-card.card-glass {
      background-color: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark-mode .themed-card.card-glass {
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .themed-card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.14);
    }

    .themed-btn {
      border-radius: var(--btn-radius);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .themed-btn:hover {
      transform: translateY(-2px);
    }
    .themed-btn:active {
      transform: scale(0.98);
    }

    .btn-primary-custom {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
    }
    .btn-glow {
      box-shadow: 0 8px 24px -4px color-mix(in srgb, var(--primary) 55%, transparent);
    }
    .btn-glow:hover {
      box-shadow: 0 12px 28px -2px color-mix(in srgb, var(--primary) 75%, transparent);
    }

    /* Анимация пульсации для блока 2ГИС */
    @keyframes pulseRing2Gis {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1.12); opacity: 0; }
    }
    .pulse-2gis::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      border: 2px solid #19b533;
      animation: pulseRing2Gis 2s infinite;
      pointer-events: none;
    }

    /* Плавное появление секций */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Скрытие скроллбара для горизонтальных вкладок на мобильных */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Специальные стили для печати тейбл-тента с QR-кодом */
    @media print {
      body * { visibility: hidden !important; }
      #qr-print-sheet, #qr-print-sheet * { visibility: visible !important; }
      #qr-print-sheet {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background: #ffffff !important;
        z-index: 99999 !important;
      }
    }
  </style>

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-red-600 text-white border-red-500'
        : type === 'info'
        ? 'bg-slate-900 text-white border-slate-700'
        : 'bg-emerald-600 text-white border-emerald-500';

      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium animate-fade-up ${colors}`;
      toast.innerHTML = `
        <span class="shrink-0">${type === 'error' ? '⚠️' : type === 'info' ? 'ℹ️' : '✅'}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    // Конвертация загруженного файла в DataURL (с оптимизацией размера)
    function handleImageFileUpload(file, callback) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Пожалуйста, выберите файл изображения (JPG, PNG, WebP)', 'error');
        return;
      }
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          callback(compressed);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /**
     * ============================================================================
     * МОДУЛЬ 6: ТРЕКИНГ КЛИКОВ И НАВИГАЦИЯ
     * ============================================================================
     */
    function trackClick(metric) {
      if (AppState.data.stats[metric] !== undefined) {
        AppState.data.stats[metric] += 1;
        StorageService.saveState(AppState.data);
      }
    }

    function setLanguage(lang) {
      AppState.lang = lang;
      localStorage.setItem(LANG_KEY, lang);
      render();
    }

    function toggleQuickDarkMode() {
      AppState.data.design.darkMode = !AppState.data.design.darkMode;
      AppState.data.design.bgColor = AppState.data.design.darkMode ? '#09090b' : '#f8fafc';
      StorageService.saveState(AppState.data);
      applyThemeVariables();
      render();
    }

    function navigateTo(route) {
      if (route === 'admin' && !StorageService.isAuthenticated()) {
        AppState.route = 'login';
      } else {
        AppState.route = route;
      }
      if (route !== 'admin') {
        AppState.previewDesign = null;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function applyDemoBusinessTemplate(key) {
      if (!BUSINESS_TEMPLATES[key]) return;
      const currentStats = AppState.data.stats;
      const currentLeads = AppState.data.leads;
      AppState.data = JSON.parse(JSON.stringify(BUSINESS_TEMPLATES[key]));
      AppState.data.stats = currentStats;
      AppState.data.leads = currentLeads;
      StorageService.saveState(AppState.data);
      applyThemeVariables();
      render();
      showToast('Шаблон бизнеса успешно применён!');
    }

    /**
     * ============================================================================
     * МОДУЛЬ 7: РЕНДЕР ПУБЛИЧНОЙ СТРАНИЦЫ БИЗНЕСА
     * ============================================================================

    function renderLanguageSwitcher() {
      const langs = [
        { code: 'ru', label: 'RU' },
        { code: 'kz', label: 'KZ' },
        { code: 'en', label: 'EN' }

      const d = AppState.previewDesign || AppState.data.design;
      return `
        <div class="inline-flex items-center p-1 rounded-xl border ${d.darkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-slate-100 border-slate-200'}">
          ${langs.map(l => `
            <button onclick="setLanguage('${l.code}')"
              class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all ${AppState.lang === l.code
                ? 'text-white shadow-sm'
                : (d.darkMode ? 'text-slate-300 hover:text-white' : 'text-slate-600 hover:text-slate-900')}"
              style="${AppState.lang === l.code ? `background: var(--primary)` : ''}">
              ${l.label}
            </button>
          `).join('')}
        </div>
      `;
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`${t('copied')} ${text}`);
      } catch (e) {
        showToast('Не удалось скопировать', 'error');
      }
      document.body.removeChild(textarea);
    }

    function scrollToSection(id) {

    function inquireAboutItem(title) {
      scrollToSection('section-contact');
      setTimeout(() => {
        const msgInput = document.getElementById('contact-message');
        const nameInput = document.getElementById('contact-name');
        if (msgInput) {
          msgInput.value = `Здравствуйте! Интересует: «${title}». Подскажите, пожалуйста, детали.`;
        }
        if (nameInput) nameInput.focus();
      }, 450);
    }

    function formatKzPhoneInput(input) {
      let digits = input.value.replace(/\D/g, '');
      if (!digits) {
        input.value = '';
        return;
      }
      if (digits[0] === '8') digits = '7' + digits.slice(1);
      if (digits[0] !== '7') digits = '7' + digits;
      digits = digits.slice(0, 11);

      let formatted = '+7';
      if (digits.length > 1) formatted += ' (' + digits.slice(1, 4);
      if (digits.length >= 4) formatted += ') ' + digits.slice(4, 7);
      if (digits.length >= 7) formatted += '-' + digits.slice(7, 9);
      if (digits.length >= 9) formatted += '-' + digits.slice(9, 11);
      input.value = formatted;
    }

    function submitContactForm(e) {
      e.preventDefault();
      const nameEl = document.getElementById('contact-name');
      const phoneEl = document.getElementById('contact-phone');
      const msgEl = document.getElementById('contact-message');

      const name = (nameEl.value || '').trim();
      const phone = (phoneEl.value || '').trim();
      const message = (msgEl.value || '').trim();

      if (name.length < 2 || phone.replace(/\D/g, '').length < 10) {
        showToast(t('formError'), 'error');
        return;
      }

      const now = new Date();
      const timestamp = now.toLocaleDateString('ru-RU') + ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

      AppState.data.leads.unshift({
        id: 'lead-' + Date.now(),
        name,
        phone,
        message,
        createdAt: timestamp
      });
      StorageService.saveState(AppState.data);

      nameEl.value = '';
      phoneEl.value = '';
      msgEl.value = '';
      showToast(t('formSuccess'), 'success');
    }

            <img src="${escapeHtml(item.url)}" class="max-h-[78vh] w-auto rounded-2xl shadow-2xl object-contain" />
            ${gallery.length > 1 ? `
              <button onclick="stepLightbox(1)" class="absolute right-2 sm:right-4 w-10 h-10 rounded-full bg-black/60 text-white hover:bg-black flex items-center justify-center text-xl">›</button>
            ` : ''}
          </div>
          <div class="mt-4 text-center text-white">
            <div class="text-sm font-semibold">${escapeHtml(item.caption || '')}</div>
            <div class="text-xs text-white/60 mt-1">${AppState.lightboxIndex + 1} / ${gallery.length}</div>
          </div>
        </div>
      `;
    }

    function stepLightbox(dir) {
      const len = AppState.data.gallery.length;
      if (!len) return;
      AppState.lightboxIndex = (AppState.lightboxIndex + dir + len) % len;
      renderLightbox();
    }

    function closeModal() {
      AppState.lightboxIndex = null;
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot) modalRoot.innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
      if (AppState.lightboxIndex !== null) {
        if (e.key === 'ArrowRight') stepLightbox(1);
        if (e.key === 'ArrowLeft') stepLightbox(-1);
      }
    });

    // Авторизация владельца
    function autofillDemoCredentials() {
      const u = document.getElementById('login-username');
      const p = document.getElementById('login-password');
      if (u) u.value = 'admin';
      if (p) p.value = 'admin123';
    }

    function handleOwnerLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      if (StorageService.login(username, password)) {
        AppState.route = 'admin';
        AppState.adminTab = 'dashboard';
        render();
        showToast('Вход выполнен успешно!');
      } else {
        const errBox = document.getElementById('login-error-box');
        if (errBox) {
          errBox.textContent = t('loginError');
          errBox.classList.remove('hidden');
        }
      }
    }

    function handleOwnerLogout() {
      StorageService.logout();
      AppState.previewDesign = null;
      AppState.route = 'public';
      render();
      showToast('Вы вышли из кабинета владельца', 'info');
    }

    // Сохранение настроек в админке
    function saveCompanyInfo(e) {
      e.preventDefault();
      AppState.data.company = {
        name: document.getElementById('cmp-name').value.trim(),
        category: document.getElementById('cmp-category').value.trim(),
        description: document.getElementById('cmp-desc').value.trim(),
        address: document.getElementById('cmp-address').value.trim(),
        phone: document.getElementById('cmp-phone').value.trim(),
        hours: document.getElementById('cmp-hours').value.trim(),
        logo: document.getElementById('cmp-logo').value.trim() || DEFAULT_STATE.company.logo,
        cover: document.getElementById('cmp-cover').value.trim() || DEFAULT_STATE.company.cover
      };
      StorageService.saveState(AppState.data);
      showToast(t('savedToast'));
    }

    // Конструктор дизайна
    function ensureDraftDesign() {
      if (!AppState.previewDesign) {
        AppState.previewDesign = JSON.parse(JSON.stringify(AppState.data.design));
      }
    }

    function selectDesignPreset(presetId) {
      const preset = DESIGN_PRESETS.find(p => p.id === presetId);
      if (!preset) return;
      ensureDraftDesign();
      AppState.previewDesign.preset = preset.id;
      AppState.previewDesign.primaryColor = preset.primary;
      AppState.previewDesign.secondaryColor = preset.secondary;
      AppState.previewDesign.bgColor = preset.bgPage;
      AppState.previewDesign.darkMode = preset.darkMode;
      applyThemeVariables();
      render();
    }

    function updateDraftDesign(key, value) {
      ensureDraftDesign();
      AppState.previewDesign[key] = value;
      AppState.previewDesign.preset = 'custom';
      applyThemeVariables();
      render();
    }

    function openDesignPreview() {
      ensureDraftDesign();
      applyThemeVariables();
      AppState.route = 'public';
      render();
    }

    function savePreviewDesign() {
      if (AppState.previewDesign) {
        AppState.data.design = JSON.parse(JSON.stringify(AppState.previewDesign));
        AppState.previewDesign = null;
        StorageService.saveState(AppState.data);
        applyThemeVariables();
        render();
        showToast(t('savedToast'));
      }
    }

    function cancelPreviewDesign() {
      AppState.previewDesign = null;
      applyThemeVariables();
      AppState.route = 'admin';
      AppState.adminTab = 'design';
      render();
    }

    function saveDesignSettings() {
      if (AppState.previewDesign) {
        AppState.data.design = JSON.parse(JSON.stringify(AppState.previewDesign));
        AppState.previewDesign = null;
      }
      StorageService.saveState(AppState.data);
      applyThemeVariables();
      render();
      showToast(t('savedToast'));
    }

    function saveSocials(e) {
      e.preventDefault();
      const waPhone = document.getElementById('soc-wa-phone').value.replace(/\D/g, '');
      const waUrl = document.getElementById('soc-whatsapp').value.trim();
      AppState.data.socials.instagram = document.getElementById('soc-instagram').value.trim();
      AppState.data.socials.whatsappPhone = waPhone || '77000000000';
      AppState.data.socials.whatsapp = waUrl || `https://wa.me/${AppState.data.socials.whatsappPhone}`;
      AppState.data.socials.routeUrl = document.getElementById('soc-route').value.trim();
      StorageService.saveState(AppState.data);
      showToast(t('savedToast'));
    }

    function save2GisLink(e) {
      e.preventDefault();
      AppState.data.socials.dgisUrl = document.getElementById('dgis-url-input').value.trim();
      StorageService.saveState(AppState.data);
      showToast(t('savedToast'));
    }

    // Услуги CRUD
    function addNewService(e) {
      e.preventDefault();
      const title = document.getElementById('new-srv-title').value.trim();
      const price = Number(document.getElementById('new-srv-price').value) || 0;
      const description = document.getElementById('new-srv-desc').value.trim();
      const image = document.getElementById('new-srv-img').value.trim() || 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=800&q=80';

      AppState.data.services.push({
        id: 'srv-' + Date.now(),
        title,
        price,
        description,
        image
      });
      StorageService.saveState(AppState.data);
      render();
      showToast('Услуга добавлена в каталог!');
    }

    function deleteService(id) {
      AppState.data.services = AppState.data.services.filter(s => s.id !== id);
      StorageService.saveState(AppState.data);
      render();
      showToast('Услуга удалена', 'info');
    }

    // Акции CRUD
    function addNewPromo(e) {
      e.preventDefault();
      const title = document.getElementById('new-prm-title').value.trim();
      const validUntil = document.getElementById('new-prm-valid').value.trim();
      const description = document.getElementById('new-prm-desc').value.trim();
      const image = document.getElementById('new-prm-img').value.trim() || 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=800&q=80';

      AppState.data.promos.push({
        id: 'prm-' + Date.now(),
        title,
        validUntil,
        description,
        image
      });
      StorageService.saveState(AppState.data);
      render();
      showToast('Акция опубликована!');
    }

    function deletePromo(id) {
      AppState.data.promos = AppState.data.promos.filter(p => p.id !== id);
      StorageService.saveState(AppState.data);
      render();
      showToast('Акция удалена', 'info');
    }

    // Галерея CRUD
    function addGalleryPhoto(e) {
      e.preventDefault();
      const url = document.getElementById('new-gal-url').value.trim();
      const caption = document.getElementById('new-gal-caption').value.trim();
      if (!url) return;

      AppState.data.gallery.push({
        id: 'gal-' + Date.now(),
        url,
        caption
      });
      StorageService.saveState(AppState.data);
      render();
      showToast('Фото добавлено в галерею!');
    }

    function deleteGalleryPhoto(id) {
      AppState.data.gallery = AppState.data.gallery.filter(g => g.id !== id);
      StorageService.saveState(AppState.data);
      render();
      showToast('Фото удалено', 'info');
    }

    // QR-код генерация, скачивание и печать
    function generateQrCodeInstance(url) {
      const container = document.getElementById('admin-qr-container');
      if (!container) return;
      container.innerHTML = '';
      const target = (url && url.trim()) ? url.trim() : window.location.href.split('#')[0];

      if (typeof QRCode !== 'undefined') {
        new QRCode(container, {
          text: target,
          width: 190,
          height: 190,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      } else {
        // Fallback на Canvas, если CDN недоступен
        const canvas = document.createElement('canvas');
        canvas.width = 190;
        canvas.height = 190;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 190, 190);
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('QR: ' + target.slice(0, 22), 14, 95);
        container.appendChild(canvas);
      }
    }

    function updateQrCaption(field, value) {
      AppState.data.qrSettings[field] = value;
      StorageService.saveState(AppState.data);
    }

    function downloadQrPng() {
      const container = document.getElementById('admin-qr-container');
      if (!container) return;
      const canvas = container.querySelector('canvas');
      const img = container.querySelector('img');
      let dataUrl = '';

      if (canvas) {
        dataUrl = canvas.toDataURL('image/png');
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) {
        showToast('QR-код ещё формируется', 'error');
        return;
      }
      const link = document.createElement('a');
      link.download = 'BusinessCard-PRO-QR.png';
      link.href = dataUrl;
      link.click();
      showToast('QR-код скачан в формате PNG!');
    }

    function printQrTableTent() {
      const container = document.getElementById('admin-qr-container');
      const printSheet = document.getElementById('qr-print-sheet');
      if (!container || !printSheet) return;

      const canvas = container.querySelector('canvas');
      const img = container.querySelector('img');
      const qrSrc = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
      const { company, qrSettings } = AppState.data;

      printSheet.innerHTML = `
        <div style="border: 3px solid #0f172a; border-radius: 28px; padding: 40px; max-width: 420px; text-align: center; font-family: Inter, sans-serif; background: #fff; color: #0f172a;">
          <div style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">${escapeHtml(company.name)}</div>
          <div style="font-size: 13px; color: #475569; margin-bottom: 24px;">${escapeHtml(company.category)}</div>
          <img src="${qrSrc}" style="width: 240px; height: 240px; margin: 0 auto 24px auto; display: block;" />
          <div style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">${escapeHtml(qrSettings.caption)}</div>
          <div style="font-size: 13px; color: #64748b; margin-bottom: 24px;">${escapeHtml(qrSettings.subCaption)}</div>
          <div style="border-top: 1px solid #e2e8f0; padding-top: 14px; font-size: 11px; font-weight: 700; color: #2563eb; letter-spacing: 0.06em;">
            BUSINESSCARD PRO • 2ГИС • INSTAGRAM • WHATSAPP
          </div>
        </div>
      `;
      printSheet.classList.remove('hidden');
      window.print();
      setTimeout(() => {
        printSheet.classList.add('hidden');
      }, 500);
    }

    function clearLeads() {
      AppState.data.leads = [];
      StorageService.saveState(AppState.data);
      render();
      showToast('Журнал заявок очищен', 'info');
    }

    function resetDemoStats() {
      AppState.data.stats = {
        pageViews: 1,
        instagramClicks: 0,
        dgisClicks: 0,
        whatsappClicks: 0,
        callClicks: 0,
        routeClicks: 0
      };
      StorageService.saveState(AppState.data);
      render();
      showToast('Счётчики демо-статистики обнулены', 'info');
    }

    function exportConfigJson() {
      const blob = new Blob([JSON.stringify(AppState.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'businesscard-pro-config.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Конфигурация экспортирована в JSON!');
    }

    function resetAllFactoryDefaults() {
      AppState.data = StorageService.resetState();
      AppState.previewDesign = null;
      applyThemeVariables();
      render();
      showToast('Все данные восстановлены к демо-настройкам по умолчанию!');
    }

    /**
     * ============================================================================
     * МОДУЛЬ 11: ГЛАВНЫЙ ЦИКЛ РЕНДЕРА
     * ============================================================================
     */
    function render() {
      applyThemeVariables();
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (AppState.route === 'login') {
        appEl.innerHTML = renderLoginPage();
      } else if (AppState.route === 'admin') {
        if (!StorageService.isAuthenticated()) {
          AppState.route = 'login';
          appEl.innerHTML = renderLoginPage();
        } else {
          appEl.innerHTML = renderAdminDashboard();
          if (AppState.adminTab === 'qr') {
            setTimeout(() => generateQrCodeInstance(), 30);
          }
        }
      } else {
        appEl.innerHTML = renderPublicPage();
      }
    }

    // Инициализация приложения при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
